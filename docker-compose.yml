services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: ticketqueue
      POSTGRES_PASSWORD: localdev
      POSTGRES_DB: ticketqueue
    # Host 5434 because local EDB Postgres clusters occupy 5432 and 5433.
    ports:
      - "5434:5432"
    volumes:
      - pgdata:/var/lib/postgresql
      - ./scripts/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ticketqueue -d ticketqueue"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  pgdata:
