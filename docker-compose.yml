services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: ticketqueue
      POSTGRES_PASSWORD: localdev
      POSTGRES_DB: ticketqueue
    # Host 5434 because local EDB Postgres clusters occupy 5432 and 5433.
    ports:
      - "5434:5432"
    volumes:
      - pgdata:/var/lib/postgresql
      - ./scripts/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ticketqueue -d ticketqueue"]
      interval: 5s
      timeout: 3s
      retries: 5

  # PgBouncer in transaction mode. Week 7 deploys this in front of RDS; running
  # it locally first is deliberate — the pgx prepared-statement incompatibility
  # (internal/db/pool.go) passes a smoke test and fails under concurrency, and
  # that is not a thing to discover inside ECS.
  pgbouncer:
    image: edoburu/pgbouncer:latest
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "6432:6432"
    volumes:
      - ./pgbouncer/pgbouncer.ini:/etc/pgbouncer/pgbouncer.ini:ro
      - ./pgbouncer/userlist.txt:/etc/pgbouncer/userlist.txt:ro
    healthcheck:
      test: ["CMD-SHELL", "PGPASSWORD=localdev psql -h 127.0.0.1 -p 6432 -U ticketqueue -d pgbouncer -tAc 'SHOW POOLS' >/dev/null 2>&1 || nc -z 127.0.0.1 6432"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  prometheus:
    image: prom/prometheus:v3.1.0
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - promdata:/prometheus
    # The three binaries run on the HOST (make run / run-worker / run-payments),
    # so Prometheus reaches them through the host gateway. Docker Desktop
    # provides host.docker.internal; this mapping makes it work on Linux too.
    extra_hosts:
      - "host.docker.internal:host-gateway"

  grafana:
    image: grafana/grafana:11.5.1
    ports:
      - "3000:3000"
    environment:
      # Local development only. Never ship these values anywhere real.
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafanadata:/var/lib/grafana
    depends_on:
      - prometheus

  # ---- The three binaries, as the images that will be deployed ----------------
  # Behind `--profile app` so `make up` stays exactly as it was: the everyday
  # loop is still `go run`, which rebuilds in a second. This profile exists to
  # test the artifact, not to replace the workflow.
  #
  # They talk to postgres through PGBOUNCER, because that is the Week 7 topology
  # and the point of doing this locally is to find the mismatch here.
  api:
    profiles: ["app"]
    image: ticketqueue/api:${IMAGE_TAG:-local}
    depends_on:
      pgbouncer: {condition: service_healthy}
      redis: {condition: service_healthy}
    environment:
      DATABASE_URL: postgres://ticketqueue:localdev@pgbouncer:6432/ticketqueue?sslmode=disable
      PGBOUNCER: "true"
      POOL_MAX_CONNS: "${POOL_MAX_CONNS:-10}"
      REDIS_ADDR: redis:6379
      PORT: "8080"
      PAYMENT_URL: http://payment-service:8082
      WEBHOOK_SECRET: whsec_localdev
    ports:
      - "8081:8080"

  worker:
    profiles: ["app"]
    image: ticketqueue/worker:${IMAGE_TAG:-local}
    depends_on:
      pgbouncer: {condition: service_healthy}
      redis: {condition: service_healthy}
    environment:
      DATABASE_URL: postgres://ticketqueue:localdev@pgbouncer:6432/ticketqueue?sslmode=disable
      PGBOUNCER: "true"
      POOL_MAX_CONNS: "${POOL_MAX_CONNS:-10}"
      REDIS_ADDR: redis:6379
      METRICS_PORT: "9091"
      PAYMENT_URL: http://payment-service:8082
    ports:
      - "9091:9091"

  payment-service:
    profiles: ["app"]
    image: ticketqueue/payment-service:${IMAGE_TAG:-local}
    environment:
      PAYMENT_PORT: "8082"
      # Overridable so the reconciliation demo can turn it off. With the webhook
      # on, tok_drops_response resolves before the caller even sees the dropped
      # connection, and the demo's premise (client gets 504, worker heals it
      # later) stops holding — see docs/demo.md.
      WEBHOOK_URL: "${WEBHOOK_URL-http://api:8080/webhooks/payment-service}"
      WEBHOOK_SECRET: whsec_localdev
    ports:
      - "8082:8082"

volumes:
  pgdata:
  promdata:
  grafanadata:
