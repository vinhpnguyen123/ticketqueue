;; PgBouncer for local verification of the Week 7 deployment shape.
;;
;; The point of running this locally is that a pgx/PgBouncer mismatch is
;; invisible until it is under concurrency, and discovering that inside ECS
;; costs hours and money. See internal/db/pool.go for the trap itself.

[databases]
;; Wildcard so both `ticketqueue` and `ticketqueue_test` route through here —
;; the integration suite uses the second one, and it must be exercised through
;; the pooler too or it proves nothing about the deployed path.
;; The password lives here because this file is LOCAL DEV ONLY. In AWS the
;; credential comes from Secrets Manager and auth_type is scram-sha-256.
* = host=postgres port=5432 user=ticketqueue password=localdev

[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 6432

;; trust: clients on the compose network are not authenticated. Acceptable
;; because this listener is reachable only from the compose network and the
;; host, with a password that is already 'localdev' in every other file.
;; NOT acceptable in AWS.
auth_type = trust
auth_file = /etc/pgbouncer/userlist.txt

;; TRANSACTION mode — the whole reason this exists. A server connection is
;; returned to the pool at COMMIT rather than at disconnect, so a handful of
;; server connections serve a very large number of clients. It is also what
;; breaks prepared statements, which is why the app runs simple protocol.
pool_mode = transaction

max_client_conn = 1000
default_pool_size = 25

;; PINNED, not left to the default, because the default changed under us.
;; PgBouncer >= 1.21 tracks named prepared statements per client and re-prepares
;; them on whatever server connection it hands out, which makes the pgx trap
;; disappear on its own; 1.25 ships with this at 200. Measured here on 1.25.2:
;;   max_prepared_statements = 200 -> 4000 transactions, 0 errors
;;   max_prepared_statements = 0   -> 4000 transactions, 107 "prepared statement
;;                                    ... does not exist", i.e. 2.7% of requests
;; The app still runs simple protocol when PGBOUNCER=true, because this value
;; is a property of whatever pooler is actually in front of the database — an
;; older PgBouncer, or RDS Proxy, will not do this for you.
max_prepared_statements = 200

;; Transaction mode returns a connection mid-session, so the usual session
;; cleanup is both unnecessary and a wasted round trip on every transaction.
server_reset_query =
server_reset_query_always = 0

;; pgx sends these at startup. PgBouncer rejects unknown startup parameters by
;; default, and the resulting error ("unsupported startup parameter") looks
;; nothing like a pooling problem.
ignore_startup_parameters = extra_float_digits,options,search_path

admin_users = ticketqueue
stats_users = ticketqueue

log_connections = 0
log_disconnections = 0
